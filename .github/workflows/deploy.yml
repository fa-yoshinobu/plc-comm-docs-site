name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - overrides/**
      - scripts/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site-artifact-id: ${{ steps.save-site.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Set up the interpreter before anything runs on it, so the collect step,
      # the tests, and the build all use the same Python rather than whichever
      # version the runner image happens to ship.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Checkout source repos
        run: |
          set -euo pipefail
          mkdir -p _src
          git clone https://github.com/fa-yoshinobu/plc-comm-computerlink-dotnet.git _src/computerlink-dotnet
          git clone https://github.com/fa-yoshinobu/plc-comm-computerlink-python.git _src/computerlink-python
          git clone https://github.com/fa-yoshinobu/plc-comm-computerlink-profiles.git _src/computerlink-profiles
          git clone https://github.com/fa-yoshinobu/plc-comm-hostlink-dotnet.git _src/hostlink-dotnet
          git clone https://github.com/fa-yoshinobu/plc-comm-hostlink-python.git _src/hostlink-python
          git clone https://github.com/fa-yoshinobu/plc-comm-hostlink-rust.git _src/hostlink-rust
          git clone https://github.com/fa-yoshinobu/node-red-contrib-plc-comm-kvhostlink.git _src/hostlink-nodered
          git clone https://github.com/fa-yoshinobu/plc-comm-hostlink-profiles.git _src/hostlink-profiles
          git clone https://github.com/fa-yoshinobu/plc-comm-slmp-dotnet.git _src/slmp-dotnet
          git clone https://github.com/fa-yoshinobu/plc-comm-slmp-python.git _src/slmp-python
          git clone https://github.com/fa-yoshinobu/plc-comm-slmp-rust.git _src/slmp-rust
          git clone https://github.com/fa-yoshinobu/plc-comm-slmp-cpp-minimal.git _src/slmp-cpp
          git clone https://github.com/fa-yoshinobu/node-red-contrib-plc-comm-slmp.git _src/slmp-nodered
          git clone https://github.com/fa-yoshinobu/plc-comm-slmp-profiles.git _src/slmp-profiles
          git clone https://github.com/fa-yoshinobu/plc-comm-mcprotocol-serial-cpp.git _src/mcprotocol-serial-cpp

      - name: Collect docs
        run: python scripts/collect_docs.py --source-root _src

      - name: Set up .NET SDK for documentation examples
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      # These tests read the documented examples against the checked-out source
      # repositories, not against the installed release packages, so they run
      # before the documentation dependencies are installed.
      - name: Test documentation generators
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Install image libraries for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Verify Python API package versions and symbols
        run: python scripts/check_python_api_packages.py --source-root _src

      - name: Build
        run: mkdocs build --strict

      - name: Verify every page has a unique title
        run: python scripts/check_page_titles.py

      # Upload the already-built static site before running the external link
      # checker. The deploy job still requires that the checker succeeds.
      - name: Save built site
        id: save-site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: built-docs-site
          path: site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      # mkdocs --strict validates relative links and anchors. This step covers
      # the links it cannot see: URLs that leave the site.
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # crates.io answers 404 unless an HTML Accept header is sent, and some
          # registries answer 403 to any non-browser client. Both mean "the host
          # refused this request", not "the page is gone", so they are accepted;
          # a 404 with the header below still fails the build.
          args: >-
            --no-progress
            --max-retries 3
            --max-concurrency 8
            --header "accept: text/html,application/xhtml+xml,*/*"
            --accept 200,206,403,429
            "docs/**/*.md"
          fail: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify site artifact ID
        env:
          SITE_ARTIFACT_ID: ${{ needs.build.outputs.site-artifact-id }}
        run: '[[ "$SITE_ARTIFACT_ID" =~ ^[0-9]+$ ]]'

      - name: Download checked site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.site-artifact-id }}
          path: ${{ runner.temp }}/built-docs-site
          digest-mismatch: error

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy
        run: bash scripts/deploy_site.sh "$RUNNER_TEMP/built-docs-site"
