name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/deploy.yml
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout source repos
        run: |
          set -euo pipefail
          mkdir -p _src
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-computerlink-dotnet.git _src/computerlink-dotnet
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-computerlink-python.git _src/computerlink-python
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-hostlink-dotnet.git _src/hostlink-dotnet
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-hostlink-python.git _src/hostlink-python
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-hostlink-rust.git _src/hostlink-rust
          git clone --depth 1 https://github.com/fa-yoshinobu/node-red-contrib-plc-comm-kvhostlink.git _src/hostlink-nodered
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-dotnet.git _src/slmp-dotnet
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-python.git _src/slmp-python
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-rust.git _src/slmp-rust
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-cpp-minimal.git _src/slmp-cpp
          git clone --depth 1 https://github.com/fa-yoshinobu/node-red-contrib-plc-comm-slmp.git _src/slmp-nodered
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-mcprotocol-serial-cpp.git _src/mcprotocol-serial-cpp

      - name: Collect docs
        run: |
          set -euo pipefail
          copy_docs() {
            local source_dir="$1"
            local target_dir="$2"
            mkdir -p "$target_dir"
            cp -R "$source_dir"/. "$target_dir"/
          }

          copy_docs _src/computerlink-dotnet/docsrc/user docs/computerlink/dotnet
          copy_docs _src/computerlink-python/docsrc/user docs/computerlink/python
          copy_docs _src/hostlink-dotnet/docsrc/user docs/hostlink/dotnet
          copy_docs _src/hostlink-python/docsrc/user docs/hostlink/python
          copy_docs _src/hostlink-rust/docs docs/hostlink/rust
          copy_docs _src/hostlink-nodered/docsrc/user docs/hostlink/nodered
          copy_docs _src/slmp-dotnet/docsrc/user docs/slmp/dotnet
          copy_docs _src/slmp-python/docsrc/user docs/slmp/python
          copy_docs _src/slmp-rust/docs docs/slmp/rust
          copy_docs _src/slmp-cpp/docsrc/user docs/slmp/cpp
          copy_docs _src/slmp-nodered/docsrc/user docs/slmp/nodered
          copy_docs _src/mcprotocol-serial-cpp/docsrc/user docs/mcprotocol/cpp
          rm -f docs/mcprotocol/cpp/README.md
          rm -f \
            docs/hostlink/rust/DEVELOPMENT_HISTORY.md \
            docs/hostlink/rust/KV5000_LIVE_VALIDATION_2026-05-03.md \
            docs/hostlink/rust/KV7000_LIVE_VALIDATION_2026-05-03.md \
            docs/hostlink/rust/RELEASE_PUBLICATION_2026-06-12.md \
            docs/slmp/rust/DEVELOPMENT_HISTORY.md \
            docs/slmp/rust/EXTENDED_DEVICE_COVERAGE_LATEST.md \
            docs/slmp/rust/IQF_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03.md \
            docs/slmp/rust/IQL_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03.md \
            docs/slmp/rust/IQL_EXTENDED_DEVICE_COVERAGE_2026-05-03.md \
            docs/slmp/rust/IQL_LIVE_STRESS_VALIDATION_2026-05-03.md \
            docs/slmp/rust/IQR_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03.md \
            docs/slmp/rust/IQR_EXTENDED_DEVICE_COVERAGE_2026-05-29.md \
            docs/slmp/rust/LCPU_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03.md \
            docs/slmp/rust/MIXED_BLOCK_WRITE_1406_NOTES_2026-05-03.md \
            docs/slmp/rust/QCPU_RUNTIME_RANGE_VALIDATION_2026-05-15.md \
            docs/slmp/rust/QNU_RUNTIME_RANGE_VALIDATION_2026-05-15.md \
            docs/slmp/rust/QNUDV_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03.md \
            docs/slmp/rust/QNUDV_RUNTIME_RANGE_VALIDATION_2026-05-15.md \
            docs/slmp/rust/RELEASE_PUBLICATION_2026-06-12.md

          python - <<'PY'
          import re
          from pathlib import Path

          replacements = {
              Path("docs/slmp/rust"): {
                  "(../src/": "(https://github.com/fa-yoshinobu/plc-comm-slmp-rust/blob/main/src/",
              },
              Path("docs/mcprotocol/cpp"): {
                  "(../../examples/": "(https://github.com/fa-yoshinobu/plc-comm-mcprotocol-serial-cpp/blob/main/examples/",
                  "(../../include/": "(https://github.com/fa-yoshinobu/plc-comm-mcprotocol-serial-cpp/blob/main/include/",
              },
          }

          for folder, rules in replacements.items():
              for path in folder.rglob("*.md"):
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  for old, new in rules.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")

          retained_note = "retained in the source repository technical notes"
          local_validation_link = re.compile(r"\[([^\]]+)\]\(\.\./validation/reports/[A-Za-z0-9_./-]+\.md\)")
          technical_record_link = re.compile(
              r"\[([^\]]+)\]\((?:"
              r"KV5000_LIVE_VALIDATION_2026-05-03|"
              r"KV7000_LIVE_VALIDATION_2026-05-03|"
              r"IQF_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03|"
              r"IQL_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03|"
              r"IQL_LIVE_STRESS_VALIDATION_2026-05-03|"
              r"IQR_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03|"
              r"LCPU_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03|"
              r"QCPU_RUNTIME_RANGE_VALIDATION_2026-05-15|"
              r"QNU_RUNTIME_RANGE_VALIDATION_2026-05-15|"
              r"QNUDV_DEVICE_RANGE_SAMPLE_VALIDATION_2026-05-03|"
              r"QNUDV_RUNTIME_RANGE_VALIDATION_2026-05-15"
              r")\.md\)"
          )

          for folder in (Path("docs/slmp/cpp"), Path("docs/mcprotocol/cpp")):
              for path in folder.rglob("*.md"):
                  text = path.read_text(encoding="utf-8")
                  updated = local_validation_link.sub(lambda match: f"{match.group(1)} ({retained_note})", text)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")

          for path in (
              Path("docs/hostlink/rust/LATEST_COMMUNICATION_VERIFICATION.md"),
              Path("docs/slmp/rust/LATEST_COMMUNICATION_VERIFICATION.md"),
          ):
              text = path.read_text(encoding="utf-8")
              updated = technical_record_link.sub(lambda match: f"{match.group(1)} ({retained_note})", text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build
        run: mkdocs build --strict

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy
        run: mkdocs gh-deploy --force --clean
