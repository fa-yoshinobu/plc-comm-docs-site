name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - overrides/**
      - scripts/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set up the interpreter before anything runs on it, so the collect step,
      # the tests, and the build all use the same Python rather than whichever
      # version the runner image happens to ship.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout source repos
        run: |
          set -euo pipefail
          mkdir -p _src
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-computerlink-dotnet.git _src/computerlink-dotnet
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-computerlink-python.git _src/computerlink-python
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-computerlink-profiles.git _src/computerlink-profiles
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-hostlink-dotnet.git _src/hostlink-dotnet
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-hostlink-python.git _src/hostlink-python
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-hostlink-rust.git _src/hostlink-rust
          git clone --depth 1 https://github.com/fa-yoshinobu/node-red-contrib-plc-comm-kvhostlink.git _src/hostlink-nodered
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-hostlink-profiles.git _src/hostlink-profiles
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-dotnet.git _src/slmp-dotnet
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-python.git _src/slmp-python
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-rust.git _src/slmp-rust
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-cpp-minimal.git _src/slmp-cpp
          git clone --depth 1 https://github.com/fa-yoshinobu/node-red-contrib-plc-comm-slmp.git _src/slmp-nodered
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-slmp-profiles.git _src/slmp-profiles
          git clone --depth 1 https://github.com/fa-yoshinobu/plc-comm-mcprotocol-serial-cpp.git _src/mcprotocol-serial-cpp

      - name: Collect docs
        run: python scripts/collect_docs.py --source-root _src

      - name: Set up .NET SDK for documentation examples
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # These tests read the documented examples against the checked-out source
      # repositories, not against the installed release packages, so they run
      # before the documentation dependencies are installed.
      - name: Test documentation generators
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Install image libraries for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Verify Python API package versions and symbols
        run: python scripts/check_python_api_packages.py --source-root _src

      - name: Build
        run: mkdocs build --strict

      - name: Verify every page has a unique title
        run: python scripts/check_page_titles.py

      # mkdocs --strict validates relative links and anchors. This step covers
      # the links it cannot see: URLs that leave the site.
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # crates.io answers 404 unless an HTML Accept header is sent, and some
          # registries answer 403 to any non-browser client. Both mean "the host
          # refused this request", not "the page is gone", so they are accepted;
          # a 404 with the header below still fails the build.
          args: >-
            --no-progress
            --max-retries 3
            --max-concurrency 8
            --header "accept: text/html,application/xhtml+xml,*/*"
            --accept 200,206,403,429
            "docs/**/*.md"
          fail: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy
        run: mkdocs gh-deploy --force --clean
