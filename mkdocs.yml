site_name: PLC Communication Libraries
site_url: https://fa-yoshinobu.github.io/plc-comm-docs-site/
site_description: >-
  Open-source PLC communication libraries for MELSEC SLMP, KEYENCE KV Host Link,
  TOYOPUC Computerlink, and MC Protocol Serial, with .NET, Python, Rust, C++, and
  Node-RED implementations plus per-model PLC setup guides.
repo_url: https://github.com/fa-yoshinobu/plc-comm-docs-site
repo_name: fa-yoshinobu/plc-comm-docs-site
theme:
  name: material
  language: en
  favicon: assets/favicon.png
  logo: assets/favicon.png
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: overrides

