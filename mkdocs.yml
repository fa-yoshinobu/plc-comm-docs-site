plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            filters:
              - "!^_"
            members_order:
              - __all__
              - source
            preload_modules:
              - hostlink.client
              - hostlink.device_ranges
              - hostlink.errors
              - hostlink.plc_profiles
              - hostlink.utils
              - toyopuc.address
              - toyopuc.async_client
              - toyopuc.client
              - toyopuc.errors
              - toyopuc.high_level
              - toyopuc.profiles
              - toyopuc.protocol
              - toyopuc.relay
              - toyopuc.utils
              - slmp.async_client
              - slmp.client
              - slmp.constants
              - slmp.core
              - slmp.device_ranges
              - slmp.error_codes
              - slmp.errors
              - slmp.utils
            show_root_full_path: false
            show_root_heading: true
            show_source: false

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
