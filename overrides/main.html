{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set og_title = (page.title ~ " — " ~ config.site_name) if page and page.title else config.site_name %}
  {% set og_url = config.site_url ~ (page.url if page else "") %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="Documentation for PLC communication libraries — MELSEC SLMP, KV Host Link, Computerlink, MC Protocol Serial. Covers .NET, Python, Rust, C++, and Node-RED.">
  <meta property="og:image" content="{{ config.site_url }}assets/plc-communication-libraries.png">
  <meta property="og:url" content="{{ og_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}assets/plc-communication-libraries.png">
{% endblock %}
