{% extends "base.html" %}

{#
  Social cards (Material "social" plugin) own og:type / og:title / og:description /
  og:image / og:url and the twitter:* tags per page. This block only adds the few
  tags the plugin does not emit.
#}
{% block extrahead %}
  {{ super() }}
  <meta name="google-site-verification" content="I3V96pr5bjiRHynaYUOaWNHANsCze_mmi7ahkz9OxOU">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:locale" content="en_US">
{% endblock %}
